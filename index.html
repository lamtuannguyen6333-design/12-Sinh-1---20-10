<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/qvjz8QFW/Logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/style.css">
  <title>12 Sinh 1 - 20/10 💖</title>
</head>

<body class="container">
  <audio id="bgMusic" preload="auto">
    <source src="./style/Music/Nơi Pháo Hoa Rực Rỡ.mp3" type="audio/mpeg">
    <source src="./style/Music/Mua Hè Của Peppa.mp3" type="audio/mpeg">
  </audio>

  <div id="introOverlay" class="intro-overlay">
    <div class="intro-content" id="introHeartTrigger">
      <div class="heart-icon-box">
        <span class="main-heart-icon">❤️</span>
      </div>
    </div>
  </div>

  <div id="letterSection" class="letter-section hidden">
    <div class="envelope-scene" id="envelopeScene">
      <div class="envelope-base" id="envelopeBase">
        <div class="envelope-flap" id="envelopeFlap"></div>
        <div class="envelope-pocket"></div>
      </div>
      <div class="letter-card" id="letterCard">
        <div class="letter-header">
          <div class="letter-stamp">💌</div>
          <h2 class="letter-title">Lời Ngỏ Yêu Yêu</h2>
          <div class="letter-date">20/10 • Ngày Phụ Nữ Việt Nam 🌷</div>
        </div>
        <div class="letter-body">
          <div id="letterContent" class="letter-content-text"></div>
        </div>
        <div class="letter-footer">
          <button id="btnOpenMembers" class="btn-primary-action">
            <span>Xem Lời Ngỏ</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="membersSection" class="members-section hidden">
    <div class="members-wrapper">
      <div class="members-hero">
        <div class="members-pill">🌷 20/10 • Chúng tớ xin phép 🌷</div>
        <h1 class="members-heading">Gửi tặng 25 Bông Hoa vô cùng xinh xắn của lớp chúng mình</h1>
      </div>

      <div id="membersGrid" class="members-grid"></div>
    </div>

    <div class="floating-flower-btn-container">
      <button id="btnGoToFlowers" class="btn-floating-flower">
        <span class="btn-text">Mở Quà</span>
      </button>
    </div>
  </div>

  <div id="memberModal" class="member-modal hidden">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-card">
      <div class="modal-member-corner">
        <div class="modal-avatar-frame">
          <img id="modalMemberImg" src="" alt="Avatar" class="modal-avatar-pic">
          <div class="avatar-glow"></div>
        </div>
        <div class="modal-member-info">
          <h2 id="modalMemberName" class="modal-name">An Bình</h2>
        </div>
      </div>

      <div class="modal-separator">
        <span class="sep-text"> Lời chúc gửi riêng đến bạn</span>
      </div>

      <div class="modal-message-box">
        <div class="quote-icon quote-open">“</div>
        <p id="modalMemberMess" class="modal-message-text">Chúc bạn luôn xinh đẹp!</p>
        <div class="quote-icon quote-close">”</div>
      </div>

      <div class="modal-action-bar">
        <button id="btnModalCloseAction" class="btn-modal-close">
          <span>Đóng</span> 
        </button>
      </div>
    </div>
  </div>

  <div id="mainContent" class="main-content hidden">
    <div class="flower-top-nav">
      <button id="btnBackToMembers" class="btn-back-to-members">
        <i class="fa-solid fa-arrow-left"></i> <span>Danh Sách Lời Chúc</span>
      </button>
    </div>

    <div class="night"></div>

    <div class="flowers">
      <div class="flower flower--1">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>

          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>

        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>

          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>

        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
        </div>
      </div>

      <div class="flower flower--3">
        <div class="flower__leafs flower__leafs--3">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>

          <div class="flower__g-long__bottom"></div>
        </div>

      <div class="growing-grass">

      <div class="grow-ans" style="--d:2.4s">
        <div class="flower__g-right flower__g-right--1">
          <div class="leaf"></div>
        </div>
      </div>

      <div class="grow-ans" style="--d:2.8s">
        <div class="flower__g-right flower__g-right--2">
          <div class="leaf"></div>
        </div>
      </div>

      <div class="grow-ans" style="--d:2.8s">
        <div class="flower__g-front">
          <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--1">
